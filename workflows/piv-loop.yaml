name: piv-loop
description: Plan-Implement-Validate 循环：持续改进直到满足条件
default_model: deepseek-v4-flash
nodes:
  - id: plan
    node_type: prompt
    prompt: "分析目标：{{goal}}。制定第一版实现计划。"
    model: deepseek-v4-flash
    label: 制定计划

  - id: implement
    node_type: prompt
    depends_on: [plan]
    prompt: "按计划实现代码变更"
    model: sensenova-6.7-flash-lite
    label: 实施代码

  - id: validate
    node_type: bash
    depends_on: [implement]
    command: "cargo test --workspace 2>&1"
    label: 验证测试

  - id: check-pass
    node_type: prompt
    depends_on: [validate]
    prompt: "检查测试结果，判断是否通过。如未通过，分析失败原因。"
    model: deepseek-v4-flash
    label: 结果判断

  - id: iterate
    node_type: prompt
    depends_on: [check-pass]
    when: "output(check-pass)"
    prompt: "基于失败原因，调整实现方案并重试"
    model: sensenova-6.7-flash-lite
    label: 迭代改进
