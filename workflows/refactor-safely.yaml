name: refactor-safely
description: 安全重构工作流：分析→计划→重构→验证→审查
default_model: deepseek-v4-flash
nodes:
  - id: analyze
    node_type: prompt
    prompt: "分析待重构的代码：{{target_code}}。识别依赖关系和潜在风险。"
    model: deepseek-v4-flash
    label: 代码分析

  - id: plan
    node_type: prompt
    depends_on: [analyze]
    prompt: "制定安全重构方案，确保每步都可回退"
    model: deepseek-v4-flash
    label: 重构方案

  - id: refactor
    node_type: prompt
    depends_on: [plan]
    prompt: "按方案执行重构"
    model: sensenova-6.7-flash-lite
    label: 执行重构

  - id: validate
    node_type: bash
    depends_on: [refactor]
    command: "cargo test --workspace 2>&1 && cargo clippy --workspace 2>&1 || true"
    label: 验证通过

  - id: approve
    node_type: approval
    depends_on: [validate]
    prompt: "重构完成，请审查变更并确认"
    label: 审查确认
