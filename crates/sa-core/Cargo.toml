[package]
name = "sa-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
fs4 = "0.13.1"
hex = "0.4.3"
hostname = "0.4.1"
mac_address = "1.1.8"
sha2 = "0.10.9"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
tokio = { version = "1.47.1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.16", features = ["io"] }
toml = "0.8.23"
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
walkdir = "2.5.0"
which = "8.0.2"

[dev-dependencies]
tempfile = "3.21.0"
