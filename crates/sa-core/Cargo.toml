[package]
name = "sa-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
base64 = "0.22.1"
blake3 = "1.5"
chrono = { version = "0.4.42", features = ["serde"] }
fs4 = "0.13.1"
hex = "0.4.3"
hostname = "0.4.1"
mac_address = "1.1.8"
sha2 = "0.10.9"
aes-gcm = "0.10"
rand = "0.8"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
shlex = "1.3.0"
tokio = { version = "1.47.1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
encoding_rs = "0.8"
tokio-util = { version = "0.7.16", features = ["io"] }
tempfile = "3.21.0"
toml = "0.8.23"
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
moka = { version = "0.12", features = ["future", "sync"] }
glob = "0.3"
regex = "1"
walkdir = "2.5.0"
which = "8.0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
ndarray = "0.16"
thiserror = "2.0"
ts-rs = { version = "10", features = ["serde-compat", "uuid-impl", "chrono-impl"] }