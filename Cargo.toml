[workspace]
# Workspace root for the minimal "Claw" backend agent.
#
# We keep the code in a workspace so:
# - the backend binary (`claw`) can depend on `claw-core`
# - core logic stays separated and testable
#
# Note:
# - The terminal frontend (`claw-cli`) is a **separate project** located at
#   `../claw-cli` (sibling directory), per user request.
members = ["crates/claw-core", "crates/claw"]

# Cargo resolver v2 is broadly compatible and works well for our dependency set.
resolver = "2"

# ─────────────────────────────────────────────────────────────────────────────
# Build profiles
# ─────────────────────────────────────────────────────────────────────────────
#
# The user requested: "设置构建为最小体积和最快性能" (minimal size and best performance).
#
# Rust/Cargo has an inherent trade-off between "smallest size" and "fastest
# runtime". The user explicitly asked for **one** build configuration that aims
# for **both** minimal size *and* best runtime performance.
#
# We therefore tune the standard `--release` profile to be:
# - as fast as possible at runtime (`opt-level = 3`, `lto = "fat"`)
# - as small as practical (`strip = "symbols"`, `panic = "abort"`)
#
# Notes:
# - `lto = "fat"` + `codegen-units = 1` usually improves runtime performance and
#   reduces size, at the cost of longer build times.
# - `panic = "abort"` reduces binary size (no unwinding tables). It also makes
#   panics abort the process, which is acceptable for this minimal backend daemon.
# - `strip = "symbols"` removes symbol tables from the final binary. This
#   reduces size and is applied by `rustc` (no external `strip` tool needed).

[profile.release]
# Fast runtime performance.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
