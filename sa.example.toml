# StudyAdministrator (SA) configuration example.
#
# Copy this file to `sa.toml` (which is gitignored) and fill secrets.

[llm]
# Provider base URL.
# OpenAI-compatible examples:
# - "https://withapi.mosoft.icu/v1"
# Anthropic-compatible examples:
# - "https://api.anthropic.com"
# - "https://example.com/v1"
base_url = "https://withapi.mosoft.icu/v1"

# Provider API credential.
# Put real key in `sa.toml` (NOT committed).
api_key = "sk-REPLACE_ME"

# Model name.
# Examples:
# - OpenAI: "gpt-5.2"
# - Anthropic: "claude-sonnet-4-5"
model = "gpt-5.2"

# Wire protocol used for the upstream endpoint.
#
# Supported values:
# - "chat_completions"  => POST /v1/chat/completions
# - "responses"         => POST /v1/responses
# - "anthropic_messages"=> POST /v1/messages
#
# Alias spellings like "chat-completions", "chat", "anthropic", and "claude"
# are also accepted.
#
# Leave it unset to keep the historical default: "chat_completions".
# wire_api = "chat_completions"

# Optional explicit auth style.
#
# Supported values:
# - "bearer"
# - "x_api_key"
# - "anthropic_auto"
#
# Defaults:
# - chat_completions / responses => bearer
# - anthropic_messages           => anthropic_auto
#
# anthropic_auto behavior:
# - regular Anthropic-compatible API keys => x-api-key
# - Anthropic setup/OAuth tokens         => Authorization: Bearer ...
# auth_style = "anthropic_auto"

# Some providers accept `role: system`, others only accept `role: developer`.
# This option controls the role-name we use for the "system" instructions.
# - Empty / missing => defaults to "system"
# - Example for this provider/channel: "developer"
system_role_name = "developer"

# Optional reasoning depth / effort for GPT-family reasoning models.
#
# This is forwarded as the OpenAI-compatible top-level `reasoning_effort`
# request field when set.
#
# Note: Anthropic `/v1/messages` currently ignores this field in SA.
#
# Common values include:
# - "none"
# - "minimal"
# - "low"
# - "medium"
# - "high"
# - "xhigh"
#
# Leave it empty / unset to omit the field completely.
# reasoning_effort = "high"

# Safety cap: maximum reasoning / tool-call steps per task.
max_steps = 32

[compaction]
# Whether SA should automatically compress long-running conversation history.
enabled = true

# Top-level conversation persistence is always enabled.
# SA writes the durable main session to `workspace/sessions/*.jsonl`, and every
# successful compaction rotation switches to a fresh session file automatically.

# Approximate total request size at which compaction is triggered.
# This budget includes system/developer prompt, retained history, and tool schemas.
trigger_tokens = 180000

# Approximate recent-history budget kept verbatim after compaction.
keep_recent_tokens = 8000

# Budget reserved for the summary generated during compaction.
reserve_summary_tokens = 4096

# Refuse to compact very short conversations.
min_messages_to_compact = 8

[server]
# Where the daemon listens.
bind = "127.0.0.1:8765"

# WebSocket path (the daemon serves only WS for now).
ws_path = "/ws"

[workspace]
# Workspace root where the agent is allowed to operate.
# (We keep it explicit so the agent doesn't accidentally operate elsewhere.)
root_dir = "."

# Instruction file the agent loads and injects into the prompt.
agents_md = "Agents.md"

[skills]
# Skill search directories; each skill is a directory containing a `SKILL.md`.
#
# `~` is expanded to the user home directory by SA.
dirs = ["~/.codex/skills", "~/.agents/skills"]

[mcp]
# Enable external MCP (Model Context Protocol) tool servers.
enabled = false

# Configure one or more MCP servers.
#
# Preferred format: `[mcp.<name>]`
#
# Transport selection is Codex-like:
# - set `command` => infer `stdio`
# - set `url`     => infer `http`
# - if you specifically need SSE, add `transport = "sse"`
#
# Stdio example:
# [mcp.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
# cwd = "."
# tool_timeout_secs = 180
#
# `cwd` only applies to `stdio` transports.
# Relative paths are resolved against the directory containing `sa.toml`.
#
# HTTP example:
# [mcp.remote]
# url = "https://example.com/mcp"
# tool_timeout_secs = 180
#
# SSE example:
# [mcp.remote_sse]
# transport = "sse"
# url = "https://example.com/mcp/sse"
# tool_timeout_secs = 180
